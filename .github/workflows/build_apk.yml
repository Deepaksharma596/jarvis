name: Build JARVIS Mobile APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies & Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip zlib1g-dev openjdk-17-jdk autoconf libtool pkg-config aidl
        pip install --upgrade buildozer cython

    - name: Setup AIDL Symlink & Android SDK
      run: |
        AIDL_BIN=$(find /usr/local/lib/android/sdk/build-tools /usr -name aidl -type f 2>/dev/null | head -n 1)
        if [ -n "$AIDL_BIN" ]; then
          sudo ln -sf "$AIDL_BIN" /usr/local/bin/aidl
          sudo chmod +x /usr/local/bin/aidl
          echo "Symlinked AIDL from $AIDL_BIN to /usr/local/bin/aidl"
        fi

    - name: Build APK with Buildozer
      run: |
        export PATH=/usr/local/bin:$PATH:$(find /usr/local/lib/android/sdk/build-tools -mindepth 1 -maxdepth 1 | tr '\n' ':')
        cd jarvis/mobile
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JARVIS_Mobile_APK
        path: jarvis/mobile/bin/*.apk
